<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Jesse Chumo</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a192f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Inconsolata:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <main class="not-found">
      <a href="/" class="nav__logo not-found__logo" aria-label="Jesse Chumo, home"><span aria-hidden="true">JC</span></a>
      <p class="not-found__code text-gradient" aria-hidden="true">404</p>
      <h1 class="not-found__title">This page doesn't exist.</h1>
      <div class="window">
        <div class="window__bar">
          <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="window__title">~ — zsh</span>
        </div>
        <pre class="not-found__terminal"><span class="term-prompt">$</span> cd <span id="missing-path">this-page</span>
<span class="not-found__error">cd: no such file or directory</span>
<span class="term-prompt">$</span> cd ~ <span class="term-cursor" aria-hidden="true"></span></pre>
      </div>
      <a href="/" class="btn btn--primary">Take me home</a>
    </main>
    <script>
      // Echo the path the visitor actually asked for.
      (function () {
        var path = window.location.pathname.replace(/^\/+/, '') || 'this-page';
        document.getElementById('missing-path').textContent = path.length > 48 ? path.slice(0, 45) + '...' : path;
      })();
    </script>
  </body>
</html>
