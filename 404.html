<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost in the Underworld — Jesse Chumo</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0907" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="oracle underworld">
      <div class="oracle__rays" aria-hidden="true"></div>
      <span class="numeral oracle__numeral">CDIV</span>
      <p class="eyebrow oracle__eyebrow"><span class="eyebrow__rule"></span>Error 404<span class="eyebrow__rule"></span></p>
      <h1 class="oracle__title">
        <span class="oracle__line">Lost in</span>
        <span class="oracle__line"><em>the Underworld.</em></span>
      </h1>
      <p class="oracle__text">
        This path leads only to Hades. Even Orpheus found his way back, so you can too.
      </p>
      <a href="/" class="oracle__mail">
        <span>Return to the surface</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 19 5M9 5h10v10" /></svg>
      </a>
    </main>
