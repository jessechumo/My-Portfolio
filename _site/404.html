<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Jesse Chumo</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400&display=swap"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="topbar__id" href="/">jesse@chumo<span class="topbar__path">:~</span></a>
    </header>

    <main class="lost">
      <h1 class="lost__code">404</h1>
<pre class="lost__shell"><span class="accent">jesse@chumo</span>:~$ cd <span data-path>this-page</span>
<span class="lost__err">bash: cd: <span data-path>this-page</span>: No such file or directory</span>
<span class="accent">jesse@chumo</span>:~$ </pre>
      <a class="lost__home link" href="/">cd ~ <span class="arrow" aria-hidden="true">→</span></a>
    </main>

    <nav class="tmux" aria-label="Sections">
      <span class="tmux__session">jesse</span>
      <ol class="tmux__windows">
        <li><a class="is-current" href="/" aria-current="page"><span class="tmux__n">0</span><span class="tmux__name">:404</span></a></li>
        <li><a href="/#work"><span class="tmux__n">1</span><span class="tmux__name">:work</span></a></li>
        <li><a href="/#contact"><span class="tmux__n">5</span><span class="tmux__name">:contact</span></a></li>
      </ol>
    </nav>

    <script>
      // echo the path that was actually requested
      (function () {
        var path = decodeURIComponent(window.location.pathname).replace(/^\/+|\/+$/g, '') || 'this-page';
        if (path.length > 60) path = path.slice(0, 57) + '...';
        Array.prototype.forEach.call(document.querySelectorAll('[data-path]'), function (el) {
          el.textContent = path;
        });
      })();
    </script>
  </body>
</html>
